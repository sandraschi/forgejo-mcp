# forgejo-mcp bundle project (MCPB pack root).
# Trimmed runtime-only copy of the repo pyproject: uv needs a project here
# for `uv run --directory`. Dev tooling lives in the repo root, not the bundle.
[project]
name = "forgejo-mcp"
version = "0.2.0"
description = "Forgejo & Codeberg Integration Substrate (MCP bundle)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-3.0-only" }
authors = [{ name = "sandraschi" }]
dependencies = [
    "fastmcp>=3.4.4,<4",
    "fastapi>=0.115,<0.120",
    "uvicorn>=0.30,<0.36",
    "httpx>=0.27,<0.29",
    "pydantic>=2.0,<3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forgejo_mcp"]
