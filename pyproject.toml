[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forgejo-mcp"
version = "0.1.0"
description = "FastMCP 3.4.4+ server and React companion webapp for Forgejo and Codeberg integration with multi-profile and runner monitoring"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "GPL-3.0-only"}
dependencies = [
    "fastapi>=0.115.0",
    "fastmcp>=3.4.4,<4",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "prefab-ui>=0.14.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.15.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.15.2",
]

[project.scripts]
forgejo-mcp = "forgejo_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/forgejo_mcp"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "UP", "RUF"]
ignore = ["S101", "B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
